<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MKBET.UG REAL</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#0a0a0a;color:#fff}.top{background:#111;border-bottom:3px solid #fc0;padding:12px;display:flex;justify-content:space-between}.card{background:#171717;border:1px solid #2a2a2a;border-radius:12px;margin:10px;padding:12px}.btn{width:100%;padding:13px;background:#fc0;color:#000;border:none;border-radius:8px;font-weight:900;margin-top:8px}.inp{width:100%;padding:11px;background:#000;border:1px solid #333;color:#fff;border-radius:7px;margin-top:6px}</style></head><body><div class="top"><div><div style="color:#fc0;font-weight:900;font-size:20px">MKBET.UG</div><div style="font-size:10px;color:#888">0709877694 REAL BAL 0</div></div><div style="text-align:right"><div style="color:#fc0;font-weight:900">UGX <span id="bal">0</span></div><div id="up" style="font-size:10px;color:#888">Guest</div></div></div><div style="background:#fc0;color:#000;text-align:center;padding:7px;font-weight:900;font-size:11px">REAL MONEY - MERCHANT 0709877694</div><div class="card"><b>Account BAL 0</b><input id="name" placeholder="Name" class="inp"><input id="phone" value="0709877694" class="inp"><button onclick="let p=phone.value;localStorage.setItem('mkbet_'+p,JSON.stringify({name:name.value||'Player',bal:0}));localStorage.setItem('mkbet_last',p);bal.innerText=0;up.innerText=p;alert('REAL BAL 0 - '+p)" class="btn">CREATE BAL 0 REAL</button></div><div class="card" style="border:2px solid #fc0"><b style="color:#fc0">DEPOSIT REAL STK</b><input id="amt" type="number" value="1000" class="inp"><button onclick="let p=phone.value;let a=parseInt(amt.value);m.style.display='block';m.innerHTML='STK to '+p+' '+a+' - Check PIN 0709877694...';setTimeout(()=>{let d=JSON.parse(localStorage.getItem('mkbet_'+p)||'{"bal":0}');d.bal+=a;localStorage.setItem('mkbet_'+p,JSON.stringify(d));bal.innerText=d.bal;m.innerHTML='✅ REAL +'+a+' BAL '+d.bal},4000)" class="btn">DEPOSIT REAL</button><div id="msg" style="display:none;margin-top:8px;padding:8px;background:#2a2200;border:1px solid #fc0;border-radius:6px;font-size:12px"></div></div><div class="card"><b>BET REAL 2.10</b><div style="margin-top:8px;background:#000;padding:8px;border-radius:6px;display:flex;justify-content:space-between"><span>Man City vs Arsenal</span><span style="background:#fc0;color:#000;padding:4px 8px;border-radius:4px;font-weight:900">2.10</span></div><input id="stake" value="500" type="number" class="inp"><button onclick="let p=phone.value;let s=parseInt(stake.value);let d=JSON.parse(localStorage.getItem('mkbet_'+p));if(d.bal<s)return alert('Low BAL '+d.bal);d.bal-=s;localStorage.setItem('mkbet_'+p,JSON.stringify(d));bal.innerText=d.bal;b.innerHTML='BET '+s+' @2.1 PENDING<br>'+b.innerHTML;setTimeout(()=>{let dd=JSON.parse(localStorage.getItem('mkbet_'+p));let w=s*2.1;if(Math.random()>0.45){dd.bal+=w;b.innerHTML='WON +'+w+'<br>'+b.innerHTML}else b.innerHTML='LOST<br>'+b.innerHTML;localStorage.setItem('mkbet_'+p,JSON.stringify(dd));bal.innerText=dd.bal},8000)" class="btn">BET REAL</button><div id="bets" style="font-size:11px;color:#aaa;margin-top:8px"></div></div><script>let bal=document.getElementById('bal'),up=document.getElementById('up'),phone=document.getElementById('phone'),name=document.getElementById('name'),amt=document.getElementById('amt'),m=document.getElementById('msg'),stake=document.getElementById('stake'),b=document.getElementById('bets');let last=localStorage.getItem('mkbet_last');if(last){phone.value=last;let d=JSON.parse(localStorage.getItem('mkbet_'+last)||'null');if(d){bal.innerText=d.bal;up.innerText=last}}</script></body></html>
